# Change these first
owner: Blip-Core # Your GitHub organization or username, where this repository lives
repo: bliphq-status # The name of this repository

sites:
  - name: Home
    url: https://bliphq.org
  - name: Bezel
    url: https://bezel.bliphq.org

status-website:
  cname: status.bliphq.org
  # baseUrl: /bliphq-status # Add your repo slug here so relative paths resolve cleanly
  # baseUrl: /bliphq-status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Blip Status
  # introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  # introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

  js: |
    (function() {
      const favicons = {
        operational: "https://bliphq.org/assets/status/normal.svg",
        degraded: "https://bliphq.org/assets/status/degraded.svg",
        down: "https://bliphq.org/assets/status/down.svg"
      };

      function updateFavicon(url) {
        let link = document.querySelector("link[rel*='icon']");
        if (!link) {
          link = document.createElement('link');
          document.head.appendChild(link);
        }
        // Force state overwrite and ensure browser uses the correct SVG MIME type
        link.type = 'image/svg+xml';
        link.rel = 'shortcut icon';
        if (link.href !== url) {
          link.href = url;
        }
      }

      function checkStatus() {
        // Upptime renders its global state text inside a container or main header element
        const pageText = document.body.innerText || "";
        
        if (pageText.includes("All systems operational")) {
          updateFavicon(favicons.operational);
        } else if (pageText.includes("Partial outage") || pageText.includes("Degraded performance")) {
          updateFavicon(favicons.degraded);
        } else if (pageText.includes("Major outage") || pageText.includes("Down")) {
          updateFavicon(favicons.down);
        }
      }

      // Continuously poll/observe the DOM as Upptime updates it dynamically via Svelte
      if (document.body) {
        const observer = new MutationObserver(checkStatus);
        observer.observe(document.body, { childList: true, subtree: true });
        checkStatus();
      } else {
        window.addEventListener('DOMContentLoaded', () => {
          const observer = new MutationObserver(checkStatus);
          observer.observe(document.body, { childList: true, subtree: true });
          checkStatus();
        });
      }
    })();
# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
